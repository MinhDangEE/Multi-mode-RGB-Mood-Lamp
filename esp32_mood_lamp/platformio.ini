; RGB Mood Lamp trên ESP32-S3 — điều khiển qua internet bằng MQTT.
; Đổi `board` nếu devkit của bạn khác; mọi board ESP32-S3 đều chạy được.
[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; Board S3 dùng cổng USB native làm console. Nếu bạn cắm vào cổng UART
; (con CH343 trên devkit) thì bỏ hai dòng này đi.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
